<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>YenzaPlayG — Catálogo de juegos free-to-play</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explorá, buscá y guardá tus juegos free-to-play favoritos. Comentá, calificá y descubrí qué juega la comunidad.">
  <meta name="theme-color" content="#0B0B0F">

  <!-- Abre la conexion antes de que aparezcan las <img>: ahorra DNS + TLS -->
  <link rel="preconnect" href="https://www.freetogame.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.freetogame.com">
  <link rel="preconnect" href="https://freetogame-proxy.juanpablollensa.workers.dev" crossorigin>
  <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>

  <!-- Favicon embebido: sin dependencia de un CDN externo -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">

  <!-- Aplica el tema guardado antes del primer pintado: evita el flash blanco -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('yenzaplayg.theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
